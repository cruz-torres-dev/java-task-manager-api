# ========================================================================================
# APPLICATION CONFIGURATION
# ========================================================================================

# Application name
spring.application.name=task-manager-api

# ========================================================================================
# SERVER CONFIGURATION
# ========================================================================================
server.port=8080

# ========================================================================================
# H2 DATABASE CONFIGURATION
# The H2 database runs in-memory, meaning data resets each time the app restarts.
# This is ideal for development and demonstrations.
# ========================================================================================

# JDBC URL: 'mem' means in-memory; 'taskdb' is the database name
spring.datasource.url=jdbc:h2:mem:taskdb

# H2 driver class
spring.datasource.driver-class-name=org.h2.Driver

# Database credentials (default for H2)
spring.datasource.username=sa
spring.datasource.password=

# ========================================================================================
# JPA / HIBERNATE CONFIGURATION
# ========================================================================================

# 'update' will auto-create/update tables based on entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (useful for learning and debugging)
spring.jpa.show-sql=true

# Format SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# H2 dialect for query optimization
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ========================================================================================
# H2 CONSOLE (accessible at http://localhost:8080/h2-console)
# ========================================================================================

# Enable the web-based H2 console for inspecting the database
spring.h2.console.enabled=true

# URL path to access the H2 console
spring.h2.console.path=/h2-console
